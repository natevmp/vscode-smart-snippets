name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.13.0
          - 24.x
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the repository npm version
        run: npm install --global npm@11.19.0
        working-directory: ${{ runner.temp }}
      - name: Install dependencies
        run: npm ci
      - name: Verify source and dependencies
        run: npm run verify

  integration:
    name: VS Code ${{ matrix.vscode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode:
          - 1.100.0
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install the repository npm version
        run: npm install --global npm@11.19.0
        working-directory: ${{ runner.temp }}
      - name: Install dependencies
        run: npm ci
      - name: Run extension-host integration tests
        run: xvfb-run --auto-servernum npm run test:vscode
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install the repository npm version
        run: npm install --global npm@11.19.0
        working-directory: ${{ runner.temp }}
      - name: Install dependencies
        run: npm ci
      - name: Build VSIX
        run: npm run package -- --out smart-snippets.vsix
